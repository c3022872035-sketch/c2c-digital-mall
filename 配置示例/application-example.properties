# MySQL
mybatis.typeAliasesPackage=com.second.hand.trading.server.model
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/second_hand_trading?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# HTTP and upload
server.port=8080
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
userFilePath=./runtime/xmtp
baseUrl=http://localhost:8080

# MyBatis and JSON
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
server.servlet.encoding.charset=utf-8
server.servlet.encoding.enabled=true
mybatis.mapper-locations=classpath:mapper/*.xml

# Replace these values in the source configuration before enabling production payment.
# alipay.app-id=YOUR_ALIPAY_APP_ID
